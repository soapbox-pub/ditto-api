[package]
name = "ditto-api"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Ditto's API server: link previews and favicons"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "charset", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
